about:
  - "Mon parcours n'est pas linéaire, et c'est une force. En 2020, j'ai choisi de reprendre mes études pour me consacrer à la data."
  - "Cette double culture mathématiques et économie me permet d'allier rigueur statistique et compréhension des enjeux métier. Aujourd'hui, je fais évoluer ma pratique vers de nouvelles composantes comme l'AI eingeering ou la MLOps. La raison : entraîner un modèle ne suffit pas. Il faut le livrer, le versionner, le faire tourner et le maintenir. L'objectif, il est simple : construire une expertise multi-domaines afin de pouvoir répondre à l'ensemble des besoins du milieu et pouvoir prendre en responsabilités à l'avenir."

